<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시간표">
<meta name="theme-color" content="#eceef1">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231b2430'/%3E%3Cg fill='none' stroke='%23eceef1' stroke-width='7'%3E%3Cpath d='M38 52h104M38 90h104M38 128h104M64 38v104M116 38v104'/%3E%3C/g%3E%3Crect x='64' y='52' width='52' height='38' fill='%23e08a3c'/%3E%3C/svg%3E">
<title>시간표</title>
<style>
:root{
  --paper:#eceef1; --card:#f8f9fa; --ink:#1b2430; --ink-2:#5c6773; --ink-3:#8b95a1;
  --rule:#d5dae0; --rule-2:#c2c9d1; --mark:#2f6f6b; --danger:#a53b3b;
  --c0-bg:#dfe9f4; --c0-fg:#28517a; --c1-bg:#e6e2f2; --c1-fg:#4a3a78;
  --c2-bg:#dcecdf; --c2-fg:#2a5c3c; --c3-bg:#f6e5d6; --c3-fg:#8a4a1e;
  --c4-bg:#f5e1e8; --c4-fg:#8a2e4e; --c5-bg:#e7e9d6; --c5-fg:#4f5b22;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#14181d; --card:#1d2229; --ink:#e6e9ec; --ink-2:#9aa4b0; --ink-3:#6d7883;
    --rule:#2b323a; --rule-2:#3a424c; --mark:#63b3ac; --danger:#e08585;
    --c0-bg:#22384f; --c0-fg:#bcd6ef; --c1-bg:#332e4d; --c1-fg:#cfc6ef;
    --c2-bg:#20402c; --c2-fg:#b8dcc1; --c3-bg:#472f1d; --c3-fg:#f0c69c;
    --c4-bg:#452230; --c4-fg:#f0bccd; --c5-bg:#333a1e; --c5-fg:#d5dda6;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  font-size:16px;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}
header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
h1{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0}
header p{margin:0;font-size:13px;color:var(--ink-3)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--ink-2)}
select,input,button{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--rule-2);border-radius:8px;padding:5px 6px;font-size:13px}
.wrap{max-width:560px;margin:0 auto}
.days{display:grid;grid-template-columns:34px repeat(7,1fr);font-size:12px;color:var(--ink-2);text-align:center;padding-bottom:6px}
.days b{font-weight:500}
.days .we{color:var(--ink-3)}
.board{display:grid;grid-template-columns:34px 1fr}
#gut{position:relative}
#gut span{position:absolute;right:6px;font-size:11px;color:var(--ink-3);transform:translateY(-6px);font-variant-numeric:tabular-nums}
#area{position:relative;background:var(--card);border:1px solid var(--rule-2);border-radius:10px;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.hl.half{border-top-style:dashed;opacity:.55}
.vl{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule)}
.blk{position:absolute;border-radius:7px;padding:3px 5px;font-size:11px;line-height:1.22;overflow:hidden;
  word-break:break-all}
.blk .du{display:block;font-size:10px;opacity:.78;font-variant-numeric:tabular-nums}
.blk.on{box-shadow:inset 0 0 0 2px var(--mark)}
.blk.lift{box-shadow:0 3px 10px rgba(20,26,34,.28);opacity:.94}
.blk .grip{position:absolute;left:0;right:0;bottom:0;height:12px}
.blk .grip::after{content:"";position:absolute;left:50%;bottom:3px;width:16px;height:2px;margin-left:-8px;
  border-radius:2px;background:currentColor;opacity:.35}
.pv{position:absolute;border-radius:7px;border:1px dashed var(--mark);padding:3px 5px;
  background:rgba(47,111,107,.14);color:var(--mark);font-size:10px;line-height:1.25;
  font-variant-numeric:tabular-nums;overflow:hidden}
.c0{background:var(--c0-bg);color:var(--c0-fg)} .c1{background:var(--c1-bg);color:var(--c1-fg)}
.c2{background:var(--c2-bg);color:var(--c2-fg)} .c3{background:var(--c3-bg);color:var(--c3-fg)}
.c4{background:var(--c4-bg);color:var(--c4-fg)} .c5{background:var(--c5-bg);color:var(--c5-fg)}
.hint{margin:12px 2px 0;font-size:13px;color:var(--ink-3);line-height:1.65}
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.32);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule-2);
  border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  transform:translateY(110%);transition:transform .22s cubic-bezier(.2,.8,.3,1);z-index:2}
.sheet.on{transform:translateY(0)}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 10px}
#nm{width:100%;background:var(--paper);border:1px solid var(--rule-2);border-radius:9px;padding:11px 12px;font-size:16px}
#nm:focus{outline:2px solid var(--mark);outline-offset:-1px}
#err{margin:7px 2px 0;font-size:13px;color:var(--danger);min-height:1px}
.chips{display:flex;gap:9px;margin:13px 0 13px}
.chip{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule-2);padding:0}
.chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--card),0 0 0 2px var(--mark)}
.lbl{margin:0 2px 7px;font-size:12px;color:var(--ink-3)}
.dayp{display:flex;gap:6px;margin-bottom:13px}
.dayp button{flex:1;height:34px;border-radius:8px;border:1px solid var(--rule-2);background:var(--paper);font-size:13px;padding:0}
.dayp button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rows{display:flex;gap:10px;margin-bottom:8px}
.row{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:var(--paper);border:1px solid var(--rule-2);border-radius:9px;padding:6px 8px}
.row em{font-style:normal;font-size:12px;color:var(--ink-3)}
.row b{font-weight:500;font-variant-numeric:tabular-nums;font-size:15px}
.stp{display:flex;gap:4px}
.stp button{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule-2);background:var(--card);font-size:17px;line-height:1}
#dur{margin:0 2px 14px;font-size:13px;color:var(--ink-2)}
.acts{display:flex;gap:9px}
.acts button{flex:1;height:46px;border-radius:10px;border:1px solid var(--rule-2);background:var(--card);font-size:15px}
#done{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}
#del{color:var(--danger)}
button:focus-visible,select:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>시간표</h1>
    <p id="cnt"></p>
  </header>

  <div class="bar">
    <label for="h0">표시 시간</label>
    <select id="h0" aria-label="시작 시각"></select>
    <span aria-hidden="true">–</span>
    <select id="h1" aria-label="종료 시각"></select>
  </div>

  <div class="days" id="days"></div>
  <div class="board">
    <div id="gut"></div>
    <div id="area"><div id="lines"></div><div id="blocks"></div></div>
  </div>
  <p class="hint" id="hint"></p>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="블록 편집">
  <div class="in">
    <h2 id="ttl">블록</h2>
    <input id="nm" type="text" placeholder="수학, 알바, 운동" enterkeyhint="done" autocomplete="off">
    <p id="err" role="alert"></p>
    <div class="chips" id="chips"></div>
    <p class="lbl">요일 · 여러 개 고르면 같은 시간에 함께 만들어집니다</p>
    <div class="dayp" id="dayp"></div>
    <div class="rows">
      <div class="row"><em>시작</em><b id="ts"></b>
        <span class="stp"><button data-k="s" data-v="-1" aria-label="시작 30분 당기기">−</button><button data-k="s" data-v="1" aria-label="시작 30분 미루기">+</button></span></div>
      <div class="row"><em>종료</em><b id="te"></b>
        <span class="stp"><button data-k="e" data-v="-1" aria-label="종료 30분 당기기">−</button><button data-k="e" data-v="1" aria-label="종료 30분 미루기">+</button></span></div>
    </div>
    <p id="dur"></p>
    <div class="acts"><button id="copy">복사</button><button id="del">삭제</button><button id="done">완료</button></div>
  </div>
</div>

<script>
(function(){
"use strict";
var DAYS=["월","화","수","목","금","토","일"],SLOT=22,KEY="timetable.v1",HOLD=320,TOL=8;
var S={h0:8,h1:22,seq:0,blocks:[]},mem=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=S}}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){if(mem)S=mem}
  S.blocks.forEach(function(b){if(!b.g)b.g=b.id});
}
function kin(b){return S.blocks.filter(function(x){return x.g===b.g})}
function sync(b,fn){kin(b).forEach(fn)}

var area=document.getElementById("area"),lines=document.getElementById("lines"),
    layer=document.getElementById("blocks"),gut=document.getElementById("gut"),
    sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim"),
    nm=document.getElementById("nm"),err=document.getElementById("err"),
    ttl=document.getElementById("ttl"),ts=document.getElementById("ts"),te=document.getElementById("te"),
    dur=document.getElementById("dur"),h0=document.getElementById("h0"),h1=document.getElementById("h1"),
    cnt=document.getElementById("cnt"),hint=document.getElementById("hint");
var N=0,cur=null,drag=null,press=null,lastColor=0;

function clamp(v,a,b){return v<a?a:v>b?b:v}
function slots(){return (S.h1-S.h0)*2}
function label(i){var m=S.h0*60+i*30;return Math.floor(m/60)+":"+(m%60?"30":"00")}
function pad(v){return v<10?"0"+v:""+v}
function span(n){return pad(Math.floor(n/2))+":"+pad((n%2)*30)}
function find(id){for(var i=0;i<S.blocks.length;i++)if(S.blocks[i].id===id)return S.blocks[i];return null}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

function head(){
  document.getElementById("days").innerHTML="<b></b>"+DAYS.map(function(d,i){
    return "<b"+(i>4?" class='we'":"")+">"+d+"</b>"}).join("");
  document.getElementById("dayp").innerHTML=DAYS.map(function(d,i){
    return "<button data-d='"+i+"' aria-pressed='false'>"+d+"</button>"}).join("");
}
function opts(){
  var a="",b="";
  for(var i=0;i<=12;i++)a+="<option value='"+i+"'>"+i+"시</option>";
  for(var j=13;j<=24;j++)b+="<option value='"+j+"'>"+j+"시</option>";
  h0.innerHTML=a;h1.innerHTML=b;h0.value=S.h0;h1.value=S.h1;
}
function grid(){
  N=slots();
  area.style.height=gut.style.height=(N*SLOT)+"px";
  var g="",t="";
  for(var i=1;i<N;i++)g+="<div class='hl"+(i%2?" half":"")+"' style='top:"+(i*SLOT)+"px'></div>";
  for(var d=1;d<7;d++)g+="<div class='vl' style='left:"+(d*100/7)+"%'></div>";
  lines.innerHTML=g;
  for(var j=0;j<=N;j+=2)t+="<span style='top:"+(j*SLOT)+"px'>"+(S.h0+j/2)+"</span>";
  gut.innerHTML=t;
  S.blocks.forEach(function(b){b.s=clamp(b.s,0,N-1);b.e=clamp(b.e,b.s+1,N)});
  paint();
}
function box(d,s,e){
  return "left:calc("+(d*100/7)+"% + 2px);width:calc("+(100/7)+"% - 4px);top:"+(s*SLOT+1)+"px;height:"+((e-s)*SLOT-2)+"px";
}
function paint(){
  var h="";
  S.blocks.forEach(function(b){
    var n=b.e-b.s,px=n*SLOT,live=drag&&drag.id===b.id;
    h+="<div class='blk c"+b.c+(cur===b.id?" on":"")+(live?" lift":"")+"' data-id='"+b.id+"' style='"+box(b.d,b.s,b.e)+"'>"+
       esc(b.n||"이름 없음")+
       (px>=42?"<span class='du'>"+span(n)+"</span>":"")+
       "<span class='grip'></span></div>";
  });
  if(drag&&drag.mode==="new"){
    var a=Math.min(drag.a,drag.b),z=Math.max(drag.a,drag.b)+1;
    h+="<div class='pv' style='"+box(drag.d,a,z)+"'>"+span(z-a)+"</div>";
  }
  layer.innerHTML=h;
  cnt.textContent=S.blocks.length?S.blocks.length+"개":"";
  hint.innerHTML=S.blocks.length
    ?"블록을 꾹 누른 채 끌면 옮겨지고, 아래 손잡이를 끌면 길이가 바뀝니다. 짧게 누르면 편집창에서 이름·색·복사를 다룰 수 있습니다."
    :"빈 칸을 꾹 누른 채 위아래로 끌어 첫 블록을 만드세요. 그냥 쓸어넘기면 화면이 스크롤됩니다.";
}

function posAt(x,y){
  var r=area.getBoundingClientRect();
  return {d:clamp(Math.floor((x-r.left)/(r.width/7)),0,6),
          i:clamp(Math.floor((y-r.top)/SLOT),0,N-1)};
}
function begin(){
  if(!press)return;
  var p=posAt(press.x,press.y);
  if(press.el){
    var b=find(press.el.dataset.id);
    if(!b)return;
    if(press.grip){drag={mode:"size",id:b.id}}
    else{drag={mode:"move",id:b.id,off:p.i-b.s,len:b.e-b.s}}
  }else{
    drag={mode:"new",d:p.d,a:p.i,b:p.i};
  }
  press.timer=null;
  sc=null;startEdge();
  area.classList.add("hold");
  try{area.setPointerCapture(press.id)}catch(e){}
  paint();
}
var sc=null,edge=null,lastY=0;
function startEdge(){if(!edge)edge=setInterval(function(){
  if(!drag){stopEdge();return}
  var h=window.innerHeight,dy=0;
  if(lastY<110)dy=-8;else if(lastY>h-120)dy=8;
  if(dy)window.scrollBy(0,dy);
},16)}
function stopEdge(){if(edge){clearInterval(edge);edge=null}}
var glideOn=false;
function glide(v){
  glideOn=false;
  if(!isFinite(v))return;
  var y=Math.max(-42,Math.min(42,v));
  if(Math.abs(y)<2)return;
  glideOn=true;
  (function step(){
    if(!glideOn||Math.abs(y)<0.5){glideOn=false;return}
    var before=window.pageYOffset;
    window.scrollBy(0,y);
    if(window.pageYOffset===before){glideOn=false;return}
    y*=0.93;requestAnimationFrame(step);
  })();
}
area.addEventListener("pointerdown",function(e){
  if(drag||press)return;
  var el=e.target.closest(".blk");
  press={x:e.clientX,y:e.clientY,id:e.pointerId,el:el,
         grip:!!(e.target.classList&&e.target.classList.contains("grip"))};
  lastY=e.clientY;sc=null;glideOn=false;
  press.timer=setTimeout(begin,HOLD);
});
area.addEventListener("pointermove",function(e){
  lastY=e.clientY;
  if(drag){
    var p=posAt(e.clientX,e.clientY),b;
    if(drag.mode==="new"){drag.b=p.i}
    else if(drag.mode==="move"){
      b=find(drag.id);if(!b)return;
      b.s=clamp(p.i-drag.off,0,N-drag.len);b.e=b.s+drag.len;
      if(!S.blocks.some(function(x){return x.g===b.g&&x.id!==b.id&&x.d===p.d}))b.d=p.d;
      sync(b,function(x){x.s=b.s;x.e=b.e});
    }else{
      b=find(drag.id);if(!b)return;
      b.e=clamp(p.i+1,b.s+1,N);
      sync(b,function(x){x.e=b.e});
    }
    paint();return;
  }
  if(sc){
    var t=Date.now(),d=sc.y-e.clientY,dt=t-sc.t;
    sc.y=e.clientY;sc.t=t;
    if(dt>90)sc.v=0;
    else{var v=d/Math.max(dt,10)*16;sc.v=sc.v*0.6+Math.max(-42,Math.min(42,v))*0.4}
    window.scrollBy(0,d);return;
  }
  if(press&&press.timer&&(Math.abs(e.clientX-press.x)>TOL||Math.abs(e.clientY-press.y)>TOL)){
    clearTimeout(press.timer);
    sc={y:e.clientY,t:Date.now(),v:0};
    window.scrollBy(0,press.y-e.clientY);
    press=null;
  }
});
document.addEventListener("touchmove",function(e){
  if((drag||sc)&&e.cancelable)e.preventDefault();
},{passive:false});
function end(){
  var tapped=press&&press.timer?press.el:null;
  if(press&&press.timer)clearTimeout(press.timer);
  press=null;stopEdge();
  area.classList.remove("hold");
  if(sc){var v=sc.v;sc=null;glide(v);return}
  if(!drag){if(tapped)open(tapped.dataset.id,false);return}
  var d=drag;drag=null;
  if(d.mode==="new"){
    var s0=Math.min(d.a,d.b),z=Math.max(d.a,d.b)+1;
    var id="b"+(++S.seq),nb={id:id,g:id,d:d.d,s:s0,e:z,n:"",c:lastColor};
    S.blocks.push(nb);save();open(nb.id,true);
  }else{save();paint()}
}
area.addEventListener("pointerup",end);
area.addEventListener("pointercancel",end);

function open(id,focus){
  cur=id;var b=find(id);if(!b)return;
  ttl.textContent="블록 편집";nm.value=b.n;err.textContent="";
  refresh();chips();paint();
  scrim.classList.add("on");sheet.classList.add("on");
  if(focus)setTimeout(function(){nm.focus()},260);
}
function refresh(){
  var b=find(cur);if(!b)return;
  ts.textContent=label(b.s);te.textContent=label(b.e);
  var on=kin(b).map(function(x){return x.d}).sort(function(p,q){return p-q});
  dur.textContent=on.map(function(i){return DAYS[i]}).join("·")+" · "+span(b.e-b.s);
  var ds=document.getElementById("dayp").children;
  for(var i=0;i<ds.length;i++)ds[i].setAttribute("aria-pressed",on.indexOf(i)>=0?"true":"false");
}
function close(){
  var b=find(cur);
  if(b&&!b.n.trim())sync(b,function(x){x.n=nm.value.trim()});
  cur=null;save();paint();
  scrim.classList.remove("on");sheet.classList.remove("on");nm.blur();
}
function chips(){
  var b=find(cur),h="";
  for(var i=0;i<6;i++)h+="<button class='chip c"+i+"' data-c='"+i+"' aria-label='색 "+(i+1)+"' aria-pressed='"+(b&&b.c===i)+"'></button>";
  document.getElementById("chips").innerHTML=h;
}
document.getElementById("chips").addEventListener("click",function(e){
  var t=e.target.closest(".chip"),b=find(cur);if(!t||!b)return;
  lastColor=+t.dataset.c;sync(b,function(x){x.c=lastColor});save();chips();paint();
});
document.getElementById("dayp").addEventListener("click",function(e){
  var t=e.target.closest("button"),b=find(cur);if(!t||!b)return;
  var d=+t.dataset.d,fam=kin(b),sib=null;
  fam.forEach(function(x){if(x.d===d)sib=x});
  if(sib){
    if(fam.length<2)return;
    S.blocks=S.blocks.filter(function(x){return x!==sib});
    if(sib.id===cur){var rest=S.blocks.filter(function(x){return x.g===b.g})[0];cur=rest?rest.id:null}
  }else{
    var id="b"+(++S.seq);
    S.blocks.push({id:id,g:b.g,d:d,s:b.s,e:b.e,n:b.n,c:b.c});
  }
  save();refresh();paint();
});
document.querySelector(".rows").addEventListener("click",function(e){
  var t=e.target.closest("button"),b=find(cur);if(!t||!b)return;
  var v=+t.dataset.v;
  if(t.dataset.k==="s"){var s=clamp(b.s+v,0,b.e-1);b.e=clamp(b.e+(s-b.s),s+1,N);b.s=s}
  else{b.e=clamp(b.e+v,b.s+1,N)}
  sync(b,function(x){x.s=b.s;x.e=b.e});
  save();refresh();paint();
});
nm.addEventListener("input",function(){
  var b=find(cur);if(!b)return;sync(b,function(x){x.n=nm.value});err.textContent="";save();paint();
});
nm.addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("done").click()});
document.getElementById("copy").addEventListener("click",function(){
  var b=find(cur);if(!b)return;
  var len=b.e-b.s,d=b.d,s=b.s,i;
  for(i=1;i<7;i++){var nd=(d+i)%7;if(!S.blocks.some(function(x){return x.d===nd&&x.s<s+len&&x.e>s})){d=nd;break}}
  var id="b"+(++S.seq),nb={id:id,g:id,d:d,s:s,e:s+len,n:b.n,c:b.c};
  S.blocks.push(nb);save();open(nb.id,false);
});
document.getElementById("del").addEventListener("click",function(){
  var b=find(cur);
  S.blocks=b?S.blocks.filter(function(x){return x.g!==b.g}):S.blocks;
  save();close();
});
document.getElementById("done").addEventListener("click",function(){
  var b=find(cur);if(!b)return;
  if(!nm.value.trim()){err.textContent="이름을 입력하거나 블록을 삭제하세요";nm.focus();return}
  b.n=nm.value.trim();save();close();
});
scrim.addEventListener("click",function(){
  var b=find(cur);
  if(b&&!nm.value.trim())S.blocks=S.blocks.filter(function(x){return x.g!==b.g});
  close();
});
h0.addEventListener("change",function(){
  S.h0=+h0.value;if(S.h1<=S.h0){S.h1=S.h0+2;h1.value=S.h1}save();grid();
});
h1.addEventListener("change",function(){
  S.h1=+h1.value;if(S.h1<=S.h0){S.h0=S.h1-2;h0.value=S.h0}save();grid();
});
document.addEventListener("gesturestart",function(e){e.preventDefault()});

load();head();opts();grid();
})();
</script></body></html>
